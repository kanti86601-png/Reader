function pickN(arr, n) {
  const copy = [...arr];
  const out = [];
  for (let k = 0; k < n && copy.length; k++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return out;
}

const LANG_LIST = [ { key:"en", native:"English" }, { key:"hi", native:"हिंदी" }, { key:"ta", native:"தமிழ்" }, { key:"te", native:"తెలుగు" }, { key:"bn", native:"বাংলা" }, { key:"mr", native:"मराठी" } ];
const LANG_NAME_FOR_AI = { en: "English", hi: "Hindi (Devanagari script)", ta: "Tamil script", te: "Telugu script", bn: "Bengali script", mr: "Marathi (Devanagari script)" };

async function callClaudeForPassage(languageKey, difficulty, topic) {
  const languageName = LANG_NAME_FOR_AI[languageKey] || "English";
  const topicLine = topic ? `The topic should be: ${topic}.` : "Pick any everyday, safe, non-sensitive topic.";
  const prompt = `Write ONE short reading-practice paragraph (4-6 sentences) written entirely in ${languageName}, at a ${difficulty} reading level. ${topicLine} Then write one multiple-choice comprehension question about that paragraph (also in ${languageName}) with exactly 4 answer options where only one is correct.
Respond with ONLY valid JSON, no markdown code fences, no extra commentary, in exactly this shape:
{"text": "...", "question": "...", "options": ["...", "...", "...", "..."], "answer": 0}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  const raw = (data.content || []).map((b) => b.text || "").join("").trim();
  const clean = raw.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  return { text: parsed.text, q: { question: parsed.question, options: parsed.options, answer: parsed.answer } };
}

async function callClaudeForQuiz(text, languageKey) {
  const languageName = LANG_NAME_FOR_AI[languageKey] || "English";
  const prompt = `Here is a passage:\n"""${text.slice(0, 3000)}"""\nWrite ONE multiple-choice comprehension question about it (in ${languageName}) with exactly 4 answer options where only one is correct.
Respond with ONLY valid JSON, no markdown fences, no extra commentary, in exactly this shape:
{"question": "...", "options": ["...", "...", "...", "..."], "answer": 0}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 600, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await response.json();
  const raw = (data.content || []).map((b) => b.text || "").join("").trim();
  const clean = raw.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

// ---------- systematic button (theme-aware via CSS variables) ----------
function Btn({ children, onClick, variant = "primary", active = false, className = "", disabled = false }) {
  const base = "transition-all duration-150 active:scale-95 rounded-2xl font-semibold disabled:opacity-40 disabled:active:scale-100";
  const variants = {
    primary: "t-btn-primary",
    secondary: active ? "t-btn-selected shadow-sm" : "t-btn-unselected",
    ghost: "t-btn-ghost",
    dark: "t-btn-dark",
  };
  return (
    <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
}

  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authError, setAuthError] = useState(null);
  const [authBusy, setAuthBusy] = useState(false);

  const [runType, setRunType] = useState("practice"); // practice | ladder | marathon | recall
  const [mode, setMode] = useState("flow");
  const [difficulty, setDifficulty] = useState("medium");
  const [wpm, setWpm] = useState(300);
  const [theme, setTheme] = useState("blue1");
  const [lang, setLang] = useState("en");
  const t = (key) => (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key];
  const T = THEMES[theme] || THEMES.blue1;

  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [loaded, setLoaded] = useState(false);

  const [tokens, setTokens] = useState([]);
  const [sentences, setSentences] = useState([]);
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [currentQ, setCurrentQ] = useState(null);
  const [selectedOpt, setSelectedOpt] = useState(null);

  const [roundIndex, setRoundIndex] = useState(0);
  const [lives, setLives] = useState(3);
  const [roundWpm, setRoundWpm] = useState(240);

  const [customText, setCustomText] = useState("");
  const [customMode, setCustomMode] = useState("flow");
  const [isCustomRun, setIsCustomRun] = useState(false);
  const [isAiRun, setIsAiRun] = useState(false);

  const [aiLang, setAiLang] = useState("hi");
  const [aiDifficulty, setAiDifficulty] = useState("medium");
  const [aiTopic, setAiTopic] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);
  const [quizLoading, setQuizLoading] = useState(false);

  const [recallIdx, setRecallIdx] = useState(0);
  const [recallScore, setRecallScore] = useState(0);
  const [recallTimeLeft, setRecallTimeLeft] = useState(10);
  const recallQueueRef = useRef([]);
  const recallTimerRef = useRef(null);

  const marathonQueueRef = useRef([]);
  const marathonPosRef = useRef(0);

  const startRef = useRef(0);
  const totalWordsRef = useRef(0);
  const [elapsedFinal, setElapsedFinal] = useState(0);
  const [sessionSummary, setSessionSummary] = useState(null);

  // ---- auth: watch Firebase login state ----
  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setUser(u);
      setAuthChecked(true);
      if (u) setScreen((s) => (s === "login" ? "home" : s));
      else { setScreen("login"); setLoaded(false); }
    });
    return () => unsub();
  }, []);

  const doAuth = async () => {
    setAuthError(null);
    if (!authEmail.trim() || authPassword.length < 6) {
      setAuthError("Enter a valid email and a password of at least 6 characters.");
      return;
    }
    setAuthBusy(true);
    try {
      if (authMode === "login") {
        await firebase.auth().signInWithEmailAndPassword(authEmail.trim(), authPassword);
      } else {
        await firebase.auth().createUserWithEmailAndPassword(authEmail.trim(), authPassword);
      }
    } catch (e) {
      setAuthError(e.message || "Something went wrong. Try again.");
    } finally {
      setAuthBusy(false);
    }
  };

  const doLogout = async () => {
    try { await firebase.auth().signOut(); } catch (e) {}
  };

  const [feedbackText, setFeedbackText] = useState("");
  const [feedbackRating, setFeedbackRating] = useState(0);
  const [feedbackSent, setFeedbackSent] = useState(false);
  const [feedbackBusy, setFeedbackBusy] = useState(false);

  const submitFeedback = async () => {
    if (!feedbackText.trim() && feedbackRating === 0) return;
    setFeedbackBusy(true);
    try {
      await firebase.firestore().collection("feedback").add({
        uid: user.uid,
        email: user.email,
        text: feedbackText.trim(),
        rating: feedbackRating,
        createdAt: Date.now(),
      });
      setFeedbackSent(true);
      setFeedbackText("");
      setFeedbackRating(0);
    } catch (e) {
      // fail quietly, most likely a rules issue — feedback isn't critical enough to block the user
    } finally {
      setFeedbackBusy(false);
    }
  };

  // ---- load / save profile (Firestore, keyed by the logged-in user) ----
  useEffect(() => {
    if (!user) return;
    (async () => {
      try {
        const doc = await firebase.firestore().collection("readerProfiles").doc(user.uid).get();
        if (doc.exists) {
          const p = doc.data();
          setProfile({ ...DEFAULT_PROFILE, ...p });
          if (p.theme) setTheme(p.theme);
          if (p.lang) setLang(p.lang);
        }
      } catch (e) { /* first time, no saved profile yet */ }
      setLoaded(true);
    })();
  }, [user]);
  useEffect(() => {
    if (!loaded || !user) return;
    const t2 = setTimeout(() => {
      firebase.firestore().collection("readerProfiles").doc(user.uid)
        .set({ ...profile, theme, lang }, { merge: true }).catch(() => {});
    }, 500);
    return () => clearTimeout(t2);
  }, [profile, loaded, theme, lang, user]);

  const finishSession = (actualWpm, wordsRead, quizCorrect, isLadder, roundsCleared, isCustom, extra = {}) => {
    setProfile((prev) => {
      const today = todayStr();
      let streak = prev.streak;
      if (prev.lastPlayed !== today) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        streak = prev.lastPlayed === y.toISOString().slice(0, 10) ? prev.streak + 1 : 1;
      }
      let xpGain = Math.round(wordsRead / 8);
      if (quizCorrect === true) xpGain += 20;
      if (isLadder) xpGain += 25 * (roundsCleared || 0);
      if (extra.recallScore != null) xpGain += 15 * extra.recallScore;

      let dailyBonus = false;
      let lastLadderDate = prev.lastLadderDate;
      if (isLadder && runType === "ladder" && prev.lastLadderDate !== today) {
        xpGain += 30;
        dailyBonus = true;
        lastLadderDate = today;
      }

      const totalSessions = prev.totalSessions + 1;
      const newXp = prev.xp + xpGain;
      const before = levelOf(prev.xp), after = levelOf(newXp);

      const unlocked = [];
      const has = (id) => prev.achievements.includes(id);
      if (!has("first_session")) unlocked.push("first_session");
      if (actualWpm >= 300 && !has("speed_300")) unlocked.push("speed_300");
      if (streak >= 3 && !has("streak_3")) unlocked.push("streak_3");
      if (streak >= 7 && !has("streak_7")) unlocked.push("streak_7");
      if (isLadder && runType === "ladder" && !has("challenger")) unlocked.push("challenger");
      if (isLadder && runType === "ladder" && roundsCleared >= 6 && !has("ladder_master")) unlocked.push("ladder_master");
      if (isCustom && !has("own_words")) unlocked.push("own_words");
      if (extra.isAi && !has("ai_explorer")) unlocked.push("ai_explorer");
      if (totalSessions >= 10 && !has("bookworm")) unlocked.push("bookworm");
      if (extra.recallScore === 3 && !has("sharp_memory")) unlocked.push("sharp_memory");
      if (extra.marathonRounds >= 15 && !has("marathoner")) unlocked.push("marathoner");

      const bestLadderWpm = (isLadder && runType === "ladder") ? Math.max(prev.bestLadderWpm, actualWpm) : prev.bestLadderWpm;
      const marathonBest = extra.marathonRounds != null ? Math.max(prev.marathonBest, extra.marathonRounds) : prev.marathonBest;

      setSessionSummary({ xpGain, leveledUp: after > before, newLevel: after, streak, unlocked, bestLadderWpm, dailyBonus, marathonBest, recallScore: extra.recallScore });
      const history = prev.history.includes(today) ? prev.history : [...prev.history, today].slice(-30);
      return { ...prev, xp: newXp, streak, lastPlayed: today, lastLadderDate, totalSessions, achievements: [...prev.achievements, ...unlocked], bestLadderWpm, marathonBest, history };
    });
  };

  // ---- practice session builders ----
  const startPractice = () => {
    setRunType("practice");
    if (mode === "flow") {
      const pool = FLOW_PARAGRAPHS[difficulty];
      const item = pool[Math.floor(Math.random() * pool.length)];
      setTokens(item.text.split(/\s+/));
      setCurrentQ(item.q);
      totalWordsRef.current = item.text.split(/\s+/).length;
    } else {
      setSentences(SENTENCE_POOLS[difficulty]);
      setCurrentQ(null);
      totalWordsRef.current = SENTENCE_POOLS[difficulty].join(" ").split(/\s+/).length;
    }
    setIsCustomRun(false);
    setIndex(0); setPlaying(true); setSelectedOpt(null);
    startRef.current = Date.now();
    setScreen("reading");
  };

  const startCustom = () => {
    const text = customText.trim();
    if (!text) return;
    setRunType("practice");
    setIsCustomRun(true);
    if (customMode === "flow") {
      const words = text.split(/\s+/).filter(Boolean);
      setTokens(words);
      totalWordsRef.current = words.length;
    } else {
      const sents = (text.match(/[^.!?]+[.!?]+|\S+$/g) || [text]).map((s) => s.trim()).filter(Boolean);
      setSentences(sents);
      totalWordsRef.current = text.split(/\s+/).filter(Boolean).length;
    }
    setMode(customMode);
    setIsAiRun(false);
    setIndex(0); setPlaying(true); setSelectedOpt(null);
    startRef.current = Date.now();
    setScreen("reading");
  };

  const startAiPractice = async () => {
    setAiLoading(true);
    setAiError(null);
    try {
      const item = await callClaudeForPassage(aiLang, aiDifficulty, aiTopic.trim());
      setRunType("practice");
      setMode("flow");
      setIsCustomRun(false);
      setIsAiRun(true);
      setTokens(item.text.split(/\s+/));
      setCurrentQ(item.q);
      totalWordsRef.current = item.text.split(/\s+/).length;
      setIndex(0); setPlaying(true); setSelectedOpt(null);
      startRef.current = Date.now();
      setScreen("reading");
    } catch (e) {
      setAiError("Couldn't generate right now — try again in a moment.");
    } finally {
      setAiLoading(false);
    }
  };

  const generateQuizForCustom = async () => {
    if (!customText.trim()) return;
    setQuizLoading(true);
    try {
      const q = await callClaudeForQuiz(customText.trim(), lang);
      setCurrentQ(q);
    } catch (e) {
      setAiError("Couldn't create a quiz for this text — try again.");
    } finally {
      setQuizLoading(false);
    }
  };


  const startLadder = (startWpm) => {
    setRunType("ladder");
    setMode("flow");
    ladderRoundsRef.current = buildLadderRounds();
    setRoundIndex(0); setLives(3); setRoundWpm(startWpm);
    const item = ladderRoundsRef.current[0];
    setTokens(item.text.split(/\s+/));
    setCurrentQ(item.q);
    totalWordsRef.current = item.text.split(/\s+/).length;
    setIndex(0); setPlaying(true); setSelectedOpt(null);
    startRef.current = Date.now();
    setWpm(startWpm);
    setScreen("reading");
  };

  const nextLadderRound = (nextLives) => {
    const nr = roundIndex + 1;
    if (nr >= ladderRoundsRef.current.length || nextLives <= 0) {
      finishSession(roundWpm, totalWordsRef.current, null, true, nr >= ladderRoundsRef.current.length ? 6 : nr);
      setScreen("done");
      return;
    }
    const nwpm = roundWpm + LADDER_STEP;
    const item = ladderRoundsRef.current[nr];
    setRoundIndex(nr); setRoundWpm(nwpm); setWpm(nwpm);
    setTokens(item.text.split(/\s+/));
    setCurrentQ(item.q);
    totalWordsRef.current = item.text.split(/\s+/).length;
    setIndex(0); setSelectedOpt(null); setPlaying(true);
    setScreen("reading");
  };

  // ---- Marathon: fixed pace, endless survival ----
  const startMarathon = (startWpm) => {
    setRunType("marathon");
    setMode("flow");
    marathonQueueRef.current = pickN(ALL_PARAGRAPHS, ALL_PARAGRAPHS.length);
    marathonPosRef.current = 0;
    setRoundIndex(0); setLives(3); setRoundWpm(startWpm); setWpm(startWpm);
    const item = marathonQueueRef.current[0];
    setTokens(item.text.split(/\s+/));
    setCurrentQ(item.q);
    totalWordsRef.current = item.text.split(/\s+/).length;
    setIndex(0); setPlaying(true); setSelectedOpt(null);
    startRef.current = Date.now();
    setScreen("reading");
  };

  const nextMarathonRound = (nextLives) => {
    const nr = roundIndex + 1;
    if (nextLives <= 0) {
      finishSession(roundWpm, totalWordsRef.current, null, false, 0, false, { marathonRounds: nr });
      setScreen("done");
      return;
    }
    marathonPosRef.current += 1;
    if (marathonPosRef.current >= marathonQueueRef.current.length) {
      marathonQueueRef.current = pickN(ALL_PARAGRAPHS, ALL_PARAGRAPHS.length);
      marathonPosRef.current = 0;
    }
    const item = marathonQueueRef.current[marathonPosRef.current];
    setRoundIndex(nr);
    setTokens(item.text.split(/\s+/));
    setCurrentQ(item.q);
    totalWordsRef.current = item.text.split(/\s+/).length;
    setIndex(0); setSelectedOpt(null); setPlaying(true);
    setScreen("reading");
  };

  // ---- Recall Rush: 3 passages back-to-back, then rapid-fire quiz ----
  const startRecall = () => {
    setRunType("recall");
    setMode("flow");
    recallQueueRef.current = pickN(ALL_PARAGRAPHS, 3);
    setRecallIdx(0); setRecallScore(0);
    const item = recallQueueRef.current[0];
    setTokens(item.text.split(/\s+/));
    setCurrentQ(null);
    totalWordsRef.current = item.text.split(/\s+/).length;
    setIndex(0); setPlaying(true); setSelectedOpt(null);
    startRef.current = Date.now();
    setScreen("reading");
  };

  const advanceRecallReading = () => {
    const nr = recallIdx + 1;
    if (nr < 3) {
      const item = recallQueueRef.current[nr];
      setRecallIdx(nr);
      setTokens(item.text.split(/\s+/));
      totalWordsRef.current += item.text.split(/\s+/).length;
      setIndex(0); setPlaying(true);
    } else {
      setRecallIdx(0);
      setRecallTimeLeft(10);
      setSelectedOpt(null);
      setScreen("recall-quiz");
    }
  };

  useEffect(() => {
    if (screen !== "recall-quiz") { clearInterval(recallTimerRef.current); return; }
    clearInterval(recallTimerRef.current);
    recallTimerRef.current = setInterval(() => {
      setRecallTimeLeft((s) => {
        if (s <= 1) { clearInterval(recallTimerRef.current); answerRecall(-1); return 0; }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(recallTimerRef.current);
  }, [screen, recallIdx]); // eslint-disable-line

  const answerRecall = (optIndex) => {
    if (selectedOpt !== null) return;
    setSelectedOpt(optIndex);
    clearInterval(recallTimerRef.current);
    const q = recallQueueRef.current[recallIdx].q;
    const correct = optIndex === q.answer;
    const newScore = recallScore + (correct ? 1 : 0);
    setRecallScore(newScore);
    setTimeout(() => {
      const nr = recallIdx + 1;
      if (nr < 3) {
        setRecallIdx(nr); setSelectedOpt(null); setRecallTimeLeft(10);
      } else {
        finishSession(0, totalWordsRef.current, null, false, 0, false, { recallScore: newScore });
        setScreen("done");
      }
    }, 900);
  };

  // ---- advance loop ----
  useEffect(() => {
    if (screen !== "reading" || !playing) return;
    const list = mode === "flow" ? tokens : sentences;
    if (index >= list.length) {
      setElapsedFinal(Date.now() - startRef.current);
      if (runType === "recall") { advanceRecallReading(); return; }
      if (mode === "flow" && currentQ) setScreen("quiz");
      else finalizeNoQuiz();
      return;
    }
    const token = list[index];
    let delay;
    if (mode === "flow") {
      delay = 60000 / wpm;
      if (/[.,!?;:]$/.test(token)) delay *= 1.7;
      else if (token.length > 7) delay *= 1.15;
    } else {
      const wc = token.split(/\s+/).length;
      delay = Math.max((wc / wpm) * 60000, 700);
    }
    const t = setTimeout(() => setIndex((i) => i + 1), delay);
    return () => clearTimeout(t);
  }, [screen, playing, index, wpm, mode, tokens, sentences]); // eslint-disable-line

  const finalizeNoQuiz = () => {
    const mins = Math.max((Date.now() - startRef.current) / 60000, 1 / 60000);
    const actual = Math.round(totalWordsRef.current / mins) || 0;
    finishSession(actual, totalWordsRef.current, null, false, 0, isCustomRun);
    setScreen("done");
  };

  useEffect(() => {
    const onKey = (e) => {
      if (screen === "reading" && e.code === "Space") { e.preventDefault(); setPlaying((p) => !p); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [screen]);

  const answerQuiz = (optIndex) => {
    if (selectedOpt !== null) return;
    setSelectedOpt(optIndex);
    const correct = optIndex === currentQ.answer;
    const mins = Math.max((Date.now() - startRef.current) / 60000, 1 / 60000);
    const actual = Math.round(totalWordsRef.current / mins) || 0;

    setTimeout(() => {
      if (runType === "ladder") {
        const nextLives = correct ? lives : lives - 1;
        setLives(nextLives);
        nextLadderRound(nextLives);
      } else if (runType === "marathon") {
        const nextLives = correct ? lives : lives - 1;
        setLives(nextLives);
        nextMarathonRound(nextLives);
      } else {
        finishSession(actual, totalWordsRef.current, correct, false, 0, isCustomRun, { isAi: isAiRun });
        setScreen("done");
      }
    }, 1100);
  };

  const list = mode === "flow" ? tokens : sentences;
  const progress = list.length ? Math.min((index / list.length) * 100, 100) : 0;
  const currentWord = mode === "flow" ? (tokens[index] || "") : "";
  const oi = currentWord ? Math.min(orpIndex(currentWord), currentWord.length - 1) : 0;
  const left = currentWord.slice(0, oi), mid = currentWord[oi] || "", right = currentWord.slice(oi + 1);

  const level = levelOf(profile.xp);
  const xpIntoLevel = profile.xp % XP_STEP;

  const Progress = () => (
    <div className="flex items-center gap-3 bg-amber-100 border border-amber-200 rounded-2xl px-4 py-2.5">
      <div className="w-9 h-9 rounded-full bg-amber-400 flex items-center justify-center font-bold text-stone-900">
        {level}
      </div>
      <div className="flex-1 min-w-[80px]">
        <div className="h-1.5 bg-amber-200 rounded-full overflow-hidden">
          <div className="h-full bg-amber-600" style={{ width: `${(xpIntoLevel / XP_STEP) * 100}%` }} />
        </div>
      </div>
      <div className="text-sm text-stone-500 whitespace-nowrap">🔥 {profile.streak}</div>
    </div>
  );

  return (
    <div data-theme={theme} className="min-h-screen w-full flex flex-col items-center relative overflow-hidden select-none t-page">
      <style>{`
        @keyframes popIn { 0%{opacity:0; transform:scale(0.95) translateY(6px)} 100%{opacity:1; transform:scale(1) translateY(0)} }
        .pop { animation: popIn 0.25s ease-out; }
        ${Object.entries(THEMES).map(([key, th]) => `
          [data-theme="${key}"] { --page:${th.vars.page}; --card:${th.vars.card}; --cardBorder:${th.vars.cardBorder}; --dark:${th.vars.dark}; --darkText:${th.vars.darkText}; --primary:${th.vars.primary}; --primaryText:${th.vars.primaryText}; --selected:${th.vars.selected}; --selectedText:${th.vars.selectedText}; --text:${th.vars.text}; --muted:${th.vars.muted}; }
        `).join("\n")}
        .t-page { background: var(--page); color: var(--text); }
        .t-card { background: var(--card); border: 1px solid var(--cardBorder); color: var(--text); }
        .t-dark { background: var(--dark); color: var(--darkText); }
        .t-muted { color: var(--muted); }
        .t-btn-primary { background: var(--primary); color: var(--primaryText); }
        .t-btn-primary:active { filter: brightness(0.9); }
        .t-btn-selected { background: var(--selected); color: var(--selectedText); border: 1px solid var(--selected); }
        .t-btn-unselected { background: var(--card); border: 1px solid var(--cardBorder); color: var(--muted); }
        .t-btn-unselected:active { background: var(--selected); color: var(--selectedText); opacity: 0.85; }
        .t-btn-ghost { background: transparent; color: var(--muted); }
        .t-btn-ghost:active { color: var(--text); background: var(--card); }
        .t-btn-dark { background: var(--dark); color: var(--darkText); }
        .t-accent-text { color: var(--selected); }
        .t-track { background: var(--cardBorder); }
        .t-fill { background: var(--muted); }
      `}</style>

      {!user && (
        <div className="w-full max-w-md px-5 pt-10 pb-16 pop">
          <div className="font-serif text-3xl font-semibold mb-1">Reader</div>
          <p className="t-muted text-sm mb-8">{authMode === "login" ? "Log in to sync your progress." : "Create an account to save your progress in the cloud."}</p>

          <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="Email"
            className="w-full t-card rounded-2xl px-4 py-3 mb-3 outline-none" autoCapitalize="off" autoCorrect="off" />
          <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="Password (min 6 characters)"
            className="w-full t-card rounded-2xl px-4 py-3 mb-4 outline-none" />

          {authError && <p className="text-sm text-rose-600 mb-4">{authError}</p>}

          <Btn variant="primary" className="w-full py-3.5 mb-3" disabled={authBusy} onClick={doAuth}>
            {authBusy ? "Please wait…" : authMode === "login" ? "Log in" : "Sign up"}
          </Btn>
          <button onClick={() => { setAuthMode(authMode === "login" ? "signup" : "login"); setAuthError(null); }}
            className="w-full text-center text-sm t-muted py-2">
            {authMode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
          </button>
        </div>
      )}

      {user && (
      <React.Fragment>
      <div className="w-full max-w-md px-5 pt-6 pb-3 flex items-center justify-between">
        <div className="font-serif text-2xl font-semibold">{t("appName")}</div>
        {loaded && (
          <div className="flex items-center gap-3 t-card rounded-2xl px-4 py-2.5">
            <div className="w-9 h-9 rounded-full t-btn-primary flex items-center justify-center font-bold">{level}</div>
            <div className="flex-1 min-w-[80px]">
              <div className="h-1.5 t-track rounded-full overflow-hidden">
                <div className="h-full t-fill" style={{ width: `${(xpIntoLevel / XP_STEP) * 100}%` }} />
              </div>
            </div>
            <div className="text-sm t-muted whitespace-nowrap">🔥 {profile.streak}</div>
          </div>
        )}
      </div>

      {/* HOME */}
      {screen === "home" && (
        <div className="w-full max-w-md px-5 pb-16 pop">
          <p className="t-muted text-sm mb-4">{t("tagline")}</p>

          <div className="t-dark rounded-3xl p-5 mb-4">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-4xl">🔥</div>
              <div>
                <div className="font-serif text-2xl font-bold leading-none">{profile.streak} day{profile.streak === 1 ? "" : "s"}</div>
                <div className="text-xs opacity-70 mt-1">
                  {profile.streak === 0 ? "Start today to begin your streak" :
                   profile.streak < 3 ? "Nice start — keep it going" :
                   profile.streak < 7 ? "On a roll! A few more for a full week" :
                   profile.streak < 30 ? "Strong habit forming 💪" : "Incredible consistency 🏆"}
                </div>
              </div>
            </div>
            <div className="flex gap-1.5">
              {Array.from({ length: 7 }).map((_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (6 - i));
                const ds = d.toISOString().slice(0, 10);

          {runType === "ladder" && (
            <div className="t-card rounded-2xl py-4 mb-4">
              <div className="font-serif text-2xl font-bold t-accent-text">{roundWpm} wpm</div>
              <div className="text-xs uppercase tracking-widest t-muted mt-1">Peak pace reached</div>
            </div>
          )}
          {runType === "marathon" && (
            <div className="t-card rounded-2xl py-4 mb-4">
              <div className="font-serif text-2xl font-bold t-accent-text">{roundIndex} rounds</div>
              <div className="text-xs uppercase tracking-widest t-muted mt-1">Survived at {roundWpm} wpm{sessionSummary.marathonBest ? ` · best: ${sessionSummary.marathonBest}` : ""}</div>
            </div>
          )}
          {runType === "recall" && (
            <div className="t-card rounded-2xl py-4 mb-4">
              <div className="font-serif text-2xl font-bold t-accent-text">{sessionSummary.recallScore}/3</div>
              <div className="text-xs uppercase tracking-widest t-muted mt-1">Correct under time pressure</div>
            </div>
          )}

          {sessionSummary.unlocked?.length > 0 && (
            <div className="mb-6 space-y-2">
              {sessionSummary.unlocked.map((id) => (
                <div key={id} className="t-card rounded-xl px-4 py-2.5 text-sm font-semibold flex items-center gap-2 justify-center">
                  🏆 {ACHIEVEMENTS[id].label}
                </div>
              ))}
            </div>
          )}

          <div className="flex gap-3">
            <Btn variant="primary" className="flex-1 py-3" onClick={() => {
              if (runType === "ladder") setScreen("ladder-setup");
              else if (runType === "marathon") setScreen("marathon-setup");
              else if (runType === "recall") startRecall();
              else if (isCustomRun) setScreen("import-setup");
              else setScreen("practice-setup");
            }}>
              {t("goAgain")}
            </Btn>
            <Btn variant="secondary" className="flex-1 py-3" onClick={() => setScreen("home")}>{t("home")}</Btn>
          </div>
        </div>
      )}
      </React.Fragment>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Reader />);
</script>
</body>
</html>
